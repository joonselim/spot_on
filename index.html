<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spot On — 원 맞추기 게임</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    /* 밝은 남색 배경 */
    background: #4a6fd4;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  #wrap {
    display: flex;
    align-items: flex-start;
    gap: 24px;
    color: #fff;
  }
  #gamecol {
    position: relative;
    text-align: center;
  }
  #history {
    width: 160px;
    margin-top: 52px;
    text-align: left;
  }
  #history .hist-head {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    opacity: 0.9;
    margin-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.35);
    padding-bottom: 6px;
  }
  #histbest {
    font-size: 12px;
    font-weight: 700;
    color: #ffe27a;
    margin-bottom: 10px;
    min-height: 15px;
  }
  #histlist {
    max-height: 380px;
    overflow-y: auto;
  }
  #histlist:empty::after {
    content: "아직 없음";
    font-size: 12px;
    opacity: 0.6;
  }
  .hist-item {
    font-size: 13px;
    padding: 6px 9px;
    border-radius: 8px;
    background: rgba(255,255,255,0.12);
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .hist-item.fail {
    background: rgba(255,91,91,0.25);
  }
  .hist-item.perfect {
    background: rgba(74,255,161,0.32);
  }
  /* 가장 최근(맨 위) 기록 강조 */
  .hist-item:first-child {
    border: 1px solid rgba(255,255,255,0.5);
  }
  #histlist .hist-item:first-child:not(.fail):not(.perfect) {
    background: rgba(255,255,255,0.2);
  }
  .hist-item:first-child .h-key {
    opacity: 1;
  }
  .hist-item .h-key {
    opacity: 0.85;
  }
  .hist-item .h-val {
    font-weight: 700;
  }
  #tabs {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 10px;
  }
  button.tab {
    padding: 8px 22px;
    border-radius: 20px;
    border: 2px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  button.tab:hover {
    background: rgba(255,255,255,0.25);
  }
  button.tab.selected {
    background: #fff;
    color: #4a6fd4;
    border-color: #fff;
  }
  canvas {
    display: block;
    background: transparent;
    touch-action: manipulation;
  }
  #title {
    position: absolute;
    left: 0;
    right: 0;
    top: 58px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 2px;
    opacity: 0.9;
    pointer-events: none;
  }
  #hint {
    font-size: 15px;
    letter-spacing: 0.5px;
    opacity: 0.9;
    height: 20px;
    margin-top: 4px;
  }
  #best {
    font-size: 13px;
    letter-spacing: 0.5px;
    opacity: 0.85;
    height: 18px;
    margin-top: 2px;
  }
  #controls {
    margin-top: 14px;
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    transition: opacity 0.15s ease;
    min-height: 46px;
  }
  #controls.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .lvl-label {
    font-size: 13px;
    opacity: 0.8;
    margin-right: 4px;
  }
  button.lvl {
    min-width: 46px;
    height: 46px;
    padding: 0 8px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.12s ease, border-color 0.12s ease;
  }
  button.lvl:hover {
    background: rgba(255,255,255,0.25);
  }
  button.lvl:active {
    transform: scale(0.94);
  }
  button.lvl.selected {
    background: #fff;
    color: #4a6fd4;
    border-color: #fff;
  }
</style>
</head>
<body>
  <div id="wrap">
    <div id="gamecol">
      <div id="tabs">
        <button class="tab selected" data-mode="area">AREA</button>
        <button class="tab" data-mode="time">TIME</button>
      </div>
      <canvas id="game" width="520" height="440"></canvas>
      <div id="title">SPOT ON</div>
      <div id="hint"></div>
      <div id="best"></div>
      <div id="controls"></div>
    </div>
    <div id="history">
      <div class="hist-head">기록</div>
      <div id="histbest"></div>
      <div id="histlist"></div>
    </div>
  </div>

<script>
(function () {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const hint = document.getElementById("hint");
  const bestEl = document.getElementById("best");
  const controls = document.getElementById("controls");
  const histList = document.getElementById("histlist");
  const histBestEl = document.getElementById("histbest");
  const tabs = Array.from(document.querySelectorAll("button.tab"));

  // 플레이 기록 (최신이 위)
  const history = [];

  function addHistory(entryMode, entryLevel, value, isPerfect) {
    history.unshift({ mode: entryMode, level: entryLevel, value: value, perfect: !!isPerfect });
    renderHistory();
  }

  function renderHistory() {
    histList.innerHTML = "";
    history.forEach(function (h) {
      const item = document.createElement("div");
      item.className = "hist-item"
        + (h.value === null ? " fail" : "")
        + (h.perfect ? " perfect" : "");

      const key = document.createElement("span");
      key.className = "h-key";
      const val = document.createElement("span");
      val.className = "h-val";

      if (h.mode === "area") {
        key.textContent = h.level + "단계";
        val.textContent = h.value === null ? "실패" : fmt(h.value, areaDec(h.level)) + "%";
      } else {
        key.textContent = MODES.time.secs[h.level] + "초";
        val.textContent = h.value === null ? "실패" : fmt(h.value, 2) + "초";
      }
      item.appendChild(key);
      item.appendChild(val);
      histList.appendChild(item);
    });
  }

  const W = canvas.width;
  const H = canvas.height;
  const cx = W / 2;
  const cy = H / 2;

  // 큰 원 (목표) 반지름
  const targetR = 150;
  // 150% 도달 시 게임오버
  const maxR = targetR * 1.5;

  // 모드별 설정
  const MODES = {
    area: {
      levels: [1, 2, 3, 4, 5],
      labelText: "빠르기",
      // 버튼 라벨
      label: function (lv) { return String(lv); },
      // 단계별 성장 속도 (프레임당 픽셀)
      spd: { 1: 1.8, 2: 2.2, 3: 2.6, 4: 3.4, 5: 3.8 },
      speed: function (lv) { return this.spd[lv]; },
    },
    time: {
      levels: [1, 2, 3, 4],
      labelText: "시간(초)",
      // 단계별 목표 시간(초): 원이 정확히 다 차는 시간
      secs: { 1: 3, 2: 5, 3: 7, 4: 10 },
      label: function (lv) { return String(this.secs[lv]); },
    },
  };

  // 모드+단계별 최고 기록 (localStorage 저장)
  const bestScores = { area: {}, time: {} };
  ["area", "time"].forEach(function (m) {
    MODES[m].levels.forEach(function (lv) {
      const saved = parseFloat(localStorage.getItem("spoton_" + m + "_best_" + lv));
      bestScores[m][lv] = isNaN(saved) ? null : saved;
    });
  });

  // 상태
  let mode = "area";
  let state = "ready"; // ready → growing → stopped → over
  let level = 1;
  let r = 0;
  let score = 0;      // area: %, time: 초
  let startTime = 0;
  let raf = null;
  let lastPerfect = false; // 방금 정확히 맞췄는지

  function updateBestDisplay() {
    const b = bestScores[mode][level];
    let text;
    if (mode === "area") {
      text = b === null
        ? level + "단계 최고점수: -"
        : level + "단계 최고점수: " + fmt(b, areaDec(level)) + "%";
    } else {
      const t = MODES.time.secs[level];
      text = b === null
        ? t + "초 최고기록: -"
        : t + "초 최고기록: " + fmt(b, 2) + "초";
    }
    bestEl.textContent = text;
    histBestEl.textContent = text;
  }

  function selectLevel(lv) {
    level = lv;
    Array.from(controls.querySelectorAll("button.lvl")).forEach(function (b) {
      b.classList.toggle("selected", Number(b.dataset.level) === lv);
    });
    updateBestDisplay();
  }

  function buildControls() {
    controls.innerHTML = "";
    const label = document.createElement("span");
    label.className = "lvl-label";
    label.textContent = MODES[mode].labelText;
    controls.appendChild(label);

    MODES[mode].levels.forEach(function (lv) {
      const b = document.createElement("button");
      b.className = "lvl";
      b.dataset.level = lv;
      b.textContent = MODES[mode].label(lv);
      b.addEventListener("click", function () {
        selectLevel(lv);
        start();
      });
      controls.appendChild(b);
    });
    selectLevel(level);
  }

  function showControls(show) {
    controls.classList.toggle("hidden", !show);
  }

  function reset() {
    state = "ready";
    r = 0;
    score = 0;
    hint.textContent = (mode === "area" ? "빠르기" : "시간") + "를 고르거나 스페이스바로 시작하세요";
    showControls(true);
    updateBestDisplay();
    draw();
  }

  function start() {
    stopConfetti();
    lastPerfect = false;
    state = "growing";
    r = 0;
    startTime = performance.now();
    hint.textContent = "지금! 딱 맞을 때 스페이스바를 누르세요";
    showControls(false);
    loop();
  }

  function computeAreaScore() {
    const diff = Math.abs(r - targetR);
    let s = 100 - (diff / targetR) * 100;
    if (s < 0) s = 0;
    return s;
  }

  function stop() {
    state = "stopped";
    if (raf) cancelAnimationFrame(raf);

    let isNewBest = false;
    let perfect = false;
    if (mode === "area") {
      score = computeAreaScore();
      const dec = areaDec(level);
      perfect = fmt(score, dec) === "100"; // 100%
      const old = bestScores.area[level];
      if (old === null || score > old) {
        bestScores.area[level] = score;
        localStorage.setItem("spoton_area_best_" + level, String(score));
        isNewBest = true;
      }
      hint.textContent = (perfect ? "🎯 완벽! " : (isNewBest ? "🎉 신기록! " : ""))
        + "점수 " + fmt(score, dec) + "% · 다시 하려면 스페이스바";
    } else {
      score = (performance.now() - startTime) / 1000;
      const t = MODES.time.secs[level];
      perfect = fmt(score, 2) === String(t); // 목표 시간 정확히
      const old = bestScores.time[level];
      // 목표 시간에 가장 가까운 기록이 최고 기록
      if (old === null || Math.abs(score - t) < Math.abs(old - t)) {
        bestScores.time[level] = score;
        localStorage.setItem("spoton_time_best_" + level, String(score));
        isNewBest = true;
      }
      hint.textContent = (perfect ? "🎯 완벽! " : (isNewBest ? "🎉 신기록! " : ""))
        + "기록 " + fmt(score, 2) + "초 · 다시 하려면 스페이스바";
    }

    lastPerfect = perfect;
    updateBestDisplay();
    addHistory(mode, level, score, perfect);
    showControls(true);
    if (perfect) {
      spawnConfetti();
    } else {
      draw();
    }
  }

  function gameOver() {
    state = "over";
    if (raf) cancelAnimationFrame(raf);
    r = maxR;
    hint.textContent = (mode === "time" ? "시간 초과! " : "150% 초과! ") + "다시 하려면 스페이스바";
    addHistory(mode, level, null);
    showControls(true);
    draw();
  }

  function loop() {
    if (state !== "growing") return;
    if (mode === "area") {
      r += MODES.area.speed(level);
    } else {
      const elapsed = (performance.now() - startTime) / 1000;
      r = targetR * (elapsed / MODES.time.secs[level]);
    }
    if (r >= maxR) {
      gameOver();
      return;
    }
    draw();
    raf = requestAnimationFrame(loop);
  }

  // 소수점 자리수: 값이 정수면 소수점 없이 표기
  function fmt(v, decimals) {
    const n = Number(v.toFixed(decimals));
    return Number.isInteger(n) ? String(n) : n.toFixed(decimals);
  }

  // AREA 1단계는 튜토리얼: 소수점 없이 반올림
  function areaDec(lv) {
    return lv === 1 ? 0 : 1;
  }

  function valueText(v) {
    return mode === "area" ? fmt(v, areaDec(level)) + "%" : fmt(v, 2) + "초";
  }

  function drawCenterText(text) {
    // 원(작은 원) 크기에 비례해 글자 크기 조절
    const fontSize = Math.max(1, Math.min(r * 0.55, 130));
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "700 " + fontSize + "px -apple-system, sans-serif";
    ctx.lineWidth = Math.max(3, fontSize * 0.11);
    ctx.strokeStyle = "rgba(74,111,212,0.9)";
    ctx.strokeText(text, cx, cy);
    ctx.fillStyle = "#fff";
    ctx.fillText(text, cx, cy);
    ctx.restore();
  }

  // 컨페티 (정확히 맞췄을 때 원에서 팡)
  let confetti = [];
  let confettiRaf = null;

  function stopConfetti() {
    if (confettiRaf) cancelAnimationFrame(confettiRaf);
    confettiRaf = null;
    confetti = [];
  }

  function spawnConfetti() {
    const colors = ["#ffd24a", "#ff5b5b", "#4affa1", "#4ad2ff", "#ff8be0", "#ffffff"];
    confetti = [];
    const n = 70;
    for (let i = 0; i < n; i++) {
      const ang = (Math.PI * 2) * (i / n) + (i % 3) * 0.11;
      const spd = 4 + (i % 7);
      confetti.push({
        x: cx, y: cy,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 2,
        life: 1,
        color: colors[i % colors.length],
        size: 4 + (i % 5),
        rot: i,
        vr: ((i % 5) - 2) * 0.12,
      });
    }
    if (confettiRaf) cancelAnimationFrame(confettiRaf);
    confettiLoop();
  }

  function confettiLoop() {
    draw();
    let alive = false;
    confetti.forEach(function (p) {
      if (p.life <= 0) return;
      alive = true;
      p.vy += 0.25;      // 중력
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life -= 0.012;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
    });
    if (alive) {
      confettiRaf = requestAnimationFrame(confettiLoop);
    } else {
      stopConfetti();
      draw();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 작은 원 (검정 채워진 원) — 정확히 맞추면 초록색
    if (r > 0) {
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = (state === "stopped" && lastPerfect) ? "#28c76f" : "#000";
      ctx.fill();
    }

    // 큰 원 (검정 얇은 테두리)
    ctx.beginPath();
    ctx.arc(cx, cy, targetR, 0, Math.PI * 2);
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#000";
    ctx.stroke();

    if (state === "growing") {
      // 진행 중 실시간 카운터 (0부터 올라감)
      const v = mode === "area"
        ? computeAreaScore()
        : (performance.now() - startTime) / 1000;
      drawCenterText(valueText(v));
    } else if (state === "stopped") {
      drawCenterText(valueText(score));
    } else if (state === "over") {
      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "700 44px -apple-system, sans-serif";
      ctx.lineWidth = 6;
      ctx.strokeStyle = "rgba(0,0,0,0.85)";
      ctx.strokeText("GAME OVER", cx, cy);
      ctx.fillStyle = "#ff5b5b";
      ctx.fillText("GAME OVER", cx, cy);
      ctx.restore();
    }
  }

  function handleInput() {
    if (state === "growing") {
      stop();
    } else {
      start();
    }
  }

  function setMode(m) {
    if (m === mode) return;
    if (raf) cancelAnimationFrame(raf);
    stopConfetti();
    mode = m;
    tabs.forEach(function (t) {
      t.classList.toggle("selected", t.dataset.mode === m);
    });
    level = MODES[m].levels[0];
    buildControls();
    reset();
  }

  // 이벤트
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.key === " ") {
      e.preventDefault();
      handleInput();
    }
  });

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    handleInput();
  });

  tabs.forEach(function (t) {
    t.addEventListener("click", function () {
      setMode(t.dataset.mode);
    });
  });

  // 초기화
  buildControls();
  reset();
})();
</script>
</body>
</html>
