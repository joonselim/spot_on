<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spot On — 원 맞추기 게임</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    /* 밝은 남색 배경 */
    background: #4a6fd4;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  #wrap {
    position: relative;
    text-align: center;
    color: #fff;
  }
  #tabs {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 10px;
  }
  button.tab {
    padding: 8px 22px;
    border-radius: 20px;
    border: 2px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  button.tab:hover {
    background: rgba(255,255,255,0.25);
  }
  button.tab.selected {
    background: #fff;
    color: #4a6fd4;
    border-color: #fff;
  }
  canvas {
    display: block;
    background: transparent;
    touch-action: manipulation;
  }
  #title {
    position: absolute;
    left: 0;
    right: 0;
    top: 58px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 2px;
    opacity: 0.9;
    pointer-events: none;
  }
  #hint {
    font-size: 15px;
    letter-spacing: 0.5px;
    opacity: 0.9;
    height: 20px;
    margin-top: 4px;
  }
  #best {
    font-size: 13px;
    letter-spacing: 0.5px;
    opacity: 0.85;
    height: 18px;
    margin-top: 2px;
  }
  #controls {
    margin-top: 14px;
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    transition: opacity 0.15s ease;
    min-height: 46px;
  }
  #controls.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .lvl-label {
    font-size: 13px;
    opacity: 0.8;
    margin-right: 4px;
  }
  button.lvl {
    min-width: 46px;
    height: 46px;
    padding: 0 8px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.12s ease, border-color 0.12s ease;
  }
  button.lvl:hover {
    background: rgba(255,255,255,0.25);
  }
  button.lvl:active {
    transform: scale(0.94);
  }
  button.lvl.selected {
    background: #fff;
    color: #4a6fd4;
    border-color: #fff;
  }
</style>
</head>
<body>
  <div id="wrap">
    <div id="tabs">
      <button class="tab selected" data-mode="area">AREA</button>
      <button class="tab" data-mode="time">TIME</button>
    </div>
    <canvas id="game" width="520" height="440"></canvas>
    <div id="title">SPOT ON</div>
    <div id="hint"></div>
    <div id="best"></div>
    <div id="controls"></div>
  </div>

<script>
(function () {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const hint = document.getElementById("hint");
  const bestEl = document.getElementById("best");
  const controls = document.getElementById("controls");
  const tabs = Array.from(document.querySelectorAll("button.tab"));

  const W = canvas.width;
  const H = canvas.height;
  const cx = W / 2;
  const cy = H / 2;

  // 큰 원 (목표) 반지름
  const targetR = 150;
  // 150% 도달 시 게임오버
  const maxR = targetR * 1.5;

  // 모드별 설정
  const MODES = {
    area: {
      levels: [1, 2, 3, 4, 5],
      labelText: "빠르기",
      // 버튼 라벨
      label: function (lv) { return String(lv); },
      // 단계별 성장 속도 (프레임당 픽셀)
      spd: { 1: 1.8, 2: 2.2, 3: 2.6, 4: 3.4, 5: 3.8 },
      speed: function (lv) { return this.spd[lv]; },
    },
    time: {
      levels: [1, 2, 3, 4],
      labelText: "시간(초)",
      // 단계별 목표 시간(초): 원이 정확히 다 차는 시간
      secs: { 1: 3, 2: 5, 3: 7, 4: 10 },
      label: function (lv) { return String(this.secs[lv]); },
    },
  };

  // 모드+단계별 최고 기록 (localStorage 저장)
  const bestScores = { area: {}, time: {} };
  ["area", "time"].forEach(function (m) {
    MODES[m].levels.forEach(function (lv) {
      const saved = parseFloat(localStorage.getItem("spoton_" + m + "_best_" + lv));
      bestScores[m][lv] = isNaN(saved) ? null : saved;
    });
  });

  // 상태
  let mode = "area";
  let state = "ready"; // ready → growing → stopped → over
  let level = 1;
  let r = 0;
  let score = 0;      // area: %, time: 초
  let startTime = 0;
  let raf = null;

  function updateBestDisplay() {
    const b = bestScores[mode][level];
    if (mode === "area") {
      bestEl.textContent = b === null
        ? level + "단계 최고점수: -"
        : level + "단계 최고점수: " + fmt(b, 1) + "%";
    } else {
      const t = MODES.time.secs[level];
      bestEl.textContent = b === null
        ? t + "초 최고기록: -"
        : t + "초 최고기록: " + fmt(b, 2) + "초";
    }
  }

  function selectLevel(lv) {
    level = lv;
    Array.from(controls.querySelectorAll("button.lvl")).forEach(function (b) {
      b.classList.toggle("selected", Number(b.dataset.level) === lv);
    });
    updateBestDisplay();
  }

  function buildControls() {
    controls.innerHTML = "";
    const label = document.createElement("span");
    label.className = "lvl-label";
    label.textContent = MODES[mode].labelText;
    controls.appendChild(label);

    MODES[mode].levels.forEach(function (lv) {
      const b = document.createElement("button");
      b.className = "lvl";
      b.dataset.level = lv;
      b.textContent = MODES[mode].label(lv);
      b.addEventListener("click", function () {
        selectLevel(lv);
        start();
      });
      controls.appendChild(b);
    });
    selectLevel(level);
  }

  function showControls(show) {
    controls.classList.toggle("hidden", !show);
  }

  function reset() {
    state = "ready";
    r = 0;
    score = 0;
    hint.textContent = (mode === "area" ? "빠르기" : "시간") + "를 고르거나 스페이스바로 시작하세요";
    showControls(true);
    updateBestDisplay();
    draw();
  }

  function start() {
    state = "growing";
    r = 0;
    startTime = performance.now();
    hint.textContent = "지금! 딱 맞을 때 스페이스바를 누르세요";
    showControls(false);
    loop();
  }

  function computeAreaScore() {
    const diff = Math.abs(r - targetR);
    let s = 100 - (diff / targetR) * 100;
    if (s < 0) s = 0;
    return s;
  }

  function stop() {
    state = "stopped";
    if (raf) cancelAnimationFrame(raf);

    let isNewBest = false;
    if (mode === "area") {
      score = computeAreaScore();
      const old = bestScores.area[level];
      if (old === null || score > old) {
        bestScores.area[level] = score;
        localStorage.setItem("spoton_area_best_" + level, String(score));
        isNewBest = true;
      }
      hint.textContent = (isNewBest ? "🎉 신기록! " : "")
        + "점수 " + fmt(score, 1) + "% · 다시 하려면 스페이스바";
    } else {
      score = (performance.now() - startTime) / 1000;
      const t = MODES.time.secs[level];
      const old = bestScores.time[level];
      // 목표 시간에 가장 가까운 기록이 최고 기록
      if (old === null || Math.abs(score - t) < Math.abs(old - t)) {
        bestScores.time[level] = score;
        localStorage.setItem("spoton_time_best_" + level, String(score));
        isNewBest = true;
      }
      hint.textContent = (isNewBest ? "🎉 신기록! " : "")
        + "기록 " + fmt(score, 2) + "초 · 다시 하려면 스페이스바";
    }

    updateBestDisplay();
    showControls(true);
    draw();
  }

  function gameOver() {
    state = "over";
    if (raf) cancelAnimationFrame(raf);
    r = maxR;
    hint.textContent = (mode === "time" ? "시간 초과! " : "150% 초과! ") + "다시 하려면 스페이스바";
    showControls(true);
    draw();
  }

  function loop() {
    if (state !== "growing") return;
    if (mode === "area") {
      r += MODES.area.speed(level);
    } else {
      const elapsed = (performance.now() - startTime) / 1000;
      r = targetR * (elapsed / MODES.time.secs[level]);
    }
    if (r >= maxR) {
      gameOver();
      return;
    }
    draw();
    raf = requestAnimationFrame(loop);
  }

  // 소수점 자리수: 값이 정수면 소수점 없이 표기
  function fmt(v, decimals) {
    const n = Number(v.toFixed(decimals));
    return Number.isInteger(n) ? String(n) : n.toFixed(decimals);
  }

  function valueText(v) {
    return mode === "area" ? fmt(v, 1) + "%" : fmt(v, 2) + "초";
  }

  function drawCenterText(text) {
    // 원(작은 원) 크기에 비례해 글자 크기 조절
    const fontSize = Math.max(1, Math.min(r * 0.55, 130));
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "700 " + fontSize + "px -apple-system, sans-serif";
    ctx.lineWidth = Math.max(3, fontSize * 0.11);
    ctx.strokeStyle = "rgba(74,111,212,0.9)";
    ctx.strokeText(text, cx, cy);
    ctx.fillStyle = "#fff";
    ctx.fillText(text, cx, cy);
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 작은 원 (검정 채워진 원)
    if (r > 0) {
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = "#000";
      ctx.fill();
    }

    // 큰 원 (검정 얇은 테두리)
    ctx.beginPath();
    ctx.arc(cx, cy, targetR, 0, Math.PI * 2);
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#000";
    ctx.stroke();

    if (state === "growing") {
      // 진행 중 실시간 카운터 (0부터 올라감)
      const v = mode === "area"
        ? computeAreaScore()
        : (performance.now() - startTime) / 1000;
      drawCenterText(valueText(v));
    } else if (state === "stopped") {
      drawCenterText(valueText(score));
    } else if (state === "over") {
      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "700 44px -apple-system, sans-serif";
      ctx.lineWidth = 6;
      ctx.strokeStyle = "rgba(0,0,0,0.85)";
      ctx.strokeText("GAME OVER", cx, cy);
      ctx.fillStyle = "#ff5b5b";
      ctx.fillText("GAME OVER", cx, cy);
      ctx.restore();
    }
  }

  function handleInput() {
    if (state === "growing") {
      stop();
    } else {
      start();
    }
  }

  function setMode(m) {
    if (m === mode) return;
    if (raf) cancelAnimationFrame(raf);
    mode = m;
    tabs.forEach(function (t) {
      t.classList.toggle("selected", t.dataset.mode === m);
    });
    level = MODES[m].levels[0];
    buildControls();
    reset();
  }

  // 이벤트
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.key === " ") {
      e.preventDefault();
      handleInput();
    }
  });

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    handleInput();
  });

  tabs.forEach(function (t) {
    t.addEventListener("click", function () {
      setMode(t.dataset.mode);
    });
  });

  // 초기화
  buildControls();
  reset();
})();
</script>
</body>
</html>
